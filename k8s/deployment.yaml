
apiVersion: apps/v1
kind: Deployment

metadata:
  name: passkey-demo
  labels:
    app: passkey-demo

spec:
  replicas: 1

  selector:
    matchLabels:
      app: passkey-demo

  template:
    metadata:
      labels:
        app: passkey-demo

    spec:
      containers:
        - name: passkey-demo
          image: rentalabindupriya/sample2026:passkey-demo
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 5000

          env:
            - name: FLASK_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: passkey-demo-secret
                  key: FLASK_SECRET_KEY

            - name: FLASK_PRODUCTION
              value: "false"

            - name: DATABASE_URL
              value: "sqlite:////app/instance/passkey_demo.db"

            - name: SESSION_COOKIE_SECURE
              value: "false"

            - name: CSRF_PROTECT
              value: "true"

            - name: RATE_LIMIT_ENABLED
              value: "true"

            - name: WEBAUTHN_RP_ID
              value: "localhost"

            
            - name: WEBAUTHN_ORIGIN
              value: "http://localhost:30081"

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
